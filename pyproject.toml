[project]
name = "finance-tomoswells-com"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "python-dotenv==1.0.1",
  "pandas==2.2.2",
  "cvxopt==1.3.2",
  "cache-pandas==1.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "modules*", "mathematics*"]
exclude = ["app*", "backup*", "tests*", "docs*"]
